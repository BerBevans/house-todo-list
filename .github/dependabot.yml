# Opens PRs for new package versions, new SDK and base image versions, and new GitHub Actions
# versions, including harness releases. Each PR goes through the same checks as an agent's, and
# needs a code owner because the versions live in guardrail files.
version: 2

# The SDK in global.json and the images in the Dockerfile must move together: an image whose SDK
# doesn't satisfy global.json fails to build. One group puts both in the same PR.
multi-ecosystem-groups:
  sdk-and-images:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # These packages follow the .NET version: their next major needs .NET 11. Moved by hand with
    # the SDK. dotnet-ef is the EF Core tool in .config/dotnet-tools.json and must match EF Core.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]
    # .NET servicing releases move these together each month. Dependabot updates only the lock
    # file of the project that references a package directly, not the downstream projects that
    # lock it as CentralTransitive, so each such PR needs `dotnet restore --force-evaluate` by
    # hand. One group means one PR to fix a month.
    groups:
      dotnet-servicing:
        patterns: ["Microsoft.AspNetCore.*", "Microsoft.EntityFrameworkCore.*", "dotnet-ef"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: dotnet-sdk
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: sdk-and-images
    # Stay on .NET 10. A move to a new major is a decision made by hand, not a Dependabot PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: sdk-and-images
    # Stay on .NET 10. A move to a new major is a decision made by hand, not a Dependabot PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
