# Opens PRs for new package versions, new SDK and base image versions, and new GitHub Actions
# versions, including harness releases. Each PR goes through the same checks as an agent's, and
# needs a code owner because the versions live in guardrail files.
version: 2

# The SDK in global.json and the images in the Dockerfile must move together: an image whose SDK
# doesn't satisfy global.json fails to build. One group puts both in the same PR.
multi-ecosystem-groups:
  sdk-and-images:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: dotnet-sdk
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: sdk-and-images
  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: sdk-and-images
